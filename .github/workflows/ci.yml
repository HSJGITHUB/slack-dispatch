name: Offline tests and hygiene
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists PR commits on pull_request events
jobs:
  windows:
    runs-on: windows-latest
    env:
      SLACK_DISPATCH_STRICT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,console]"
      - run: python -m pytest -q
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/envhelper/tests/run_tests.ps1
      - run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/envhelper/tests/run_tests.ps1
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,console]"
      - run: ruff check .
      # GITLEAKS_LICENSE is only required for organization-owned repos
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
