lanes:
  - id: owner
    session: null
    paused: false
  - id: support
    session: session-support-placeholder
    paused: false
  - id: content
    session: null
    paused: true
# lanes[].session takes a session name, a full session id (uuid) or an id prefix of
# at least 8 hex characters. A non-null value wins over a claim in the ledger.
# Ids are resolved against the live session files in sessions_dir (default
# ~/.claude/sessions). The sample uses a dummy directory.
sessions_dir: dummy/sessions
# Optional inbox CLI display settings (inbox --config PATH or SLACK_DISPATCH_CONFIG).
# people maps user ids to display names for the author column. display_timezone is an
# IANA name for the `when` column, for example Asia/Seoul; names other than UTC need a
# time zone database (on Windows install the tzdata package), otherwise UTC is shown.
people:
  U0000000091: Dummy Person One
  U0000000093: Dummy Owner
display_timezone: UTC
# channel_defaults entries take an optional mention_only flag (P26, default false). In a
# mention_only channel a post is routed only when it has attention (an exact mention of
# always_human.owner_user or a mention user, or an always_human author) or replies in a
# thread that already has a binding; every other post is recorded as excluded with note
# excluded:no_mention (no inbox record, wake, queue entry or human notice). Bot posts there
# are excluded:bot under bot_messages.policy route_or_exclude. Not valid in dm_defaults.
# mention_only: owner (P30) is mention-only too, but only an exact owner mention opens the
# channel (an always_human author's post outside a bound thread is excluded as well). In
# both modes a post by always_human.owner_user (owner_signals.posts: record) binds its
# thread to the channel default lane (when not null), so replies to it are routed there.
# Example: C0000000006: {default: owner, mention_only: owner}
channel_defaults:
  C0000000001: {default: support}
  C0000000002: {default: null}
  C0000000004: {default: owner, mention_only: true}
dm_defaults:
  D0000000001: {default: owner}
person_channel_rules:
  - person: U0000000001
    channel: C0000000002
    lane: content
explicit_tags:
  '[support]': support
  '[content]': content
excluded_channels: [C0000000003]
timers:
  unassigned_seconds: 1800
  unacknowledged_seconds: 14400
  reassign_seconds: 86400
wake_policy:
  mode: immediate
  enabled: true
  debounce_seconds: 90
  storm_per_hour: 30
  batch_seconds: 600
  state_dir: state
  immediate_users: [U0000000004]
  owner_user: U0000000005
  # Which message_changed edits wake a lane (P22). changed_after_ack (default): only a text
  # change of an item the lane already acked or closed, once per
  # service.followup_window_seconds; other edits update the ledger silently. always: every
  # edit wakes (the behaviour before P22). never: edits update the ledger only.
  followup: changed_after_ack
  # Optional (P37, default false): with true, an edit that would re-deliver an item that
  # holds a lane is recorded only when it changed decoration only: sentence punctuation,
  # emoticons such as =) or ^^, added emoji, case, spacing and link or mention labels. Any
  # wording change, number, operator (- > / ->), removed or swapped emoji, or punctuation
  # next to a digit still re-delivers.
  # followup_ignore_cosmetic: false
  # Backfill found by a reconcile pass whose Slack ts is at most this many minutes old (a
  # post made while the service restarted) wakes the lane like a live post (P23); older
  # backfill fills the inbox without a wake. 0 disables catch-up wakes.
  catchup_minutes: 30
inbox:
  root: inbox
notify_adapters:
  - kind: file_inbox
    path: inbox
  - kind: session_message
    command_template: [dummy-session-cli, --target, "{target}", --message, "{message}"]
    template:
      cli: "python -m slack_dispatch.inbox.cli --ledger dummy/state/ledger.sqlite3 --inbox-root dummy/inbox"
      message: |-
        Lane {lane}: {count} inbox item(s) ({kinds}); attention: {attention}. Sent {sent_at}.
        IDs: {ids}
        Read thread context: {cli} inbox {lane} --thread
        Reroute lane IDs: {lanes}
        Your session's own records stay as they are.
    dry_run: true
    timeout: 60
  - kind: file_drop
    outbox_dir: state/assistant-outbox
    template: {lane: "{lane}", count: "{count}", ids: "{ids}", title: "{title}", body: "{body}"}
# A session_message adapter with purpose human_queue addresses template.target
# (default: operator) directly; no lane, claim, session lookup or pause applies:
#  - kind: session_message
#    purpose: human_queue
#    command_template: [dummy-session-cli, --target, "{target}", --message, "{message}"]
#    template: {target: dummy-operator-session}
# A dispatch_card adapter (P12) writes card bot requests for immediate human-queue
# notices (owner mentions, always_human) to <dir>/cards/; digests never produce cards.
# workspace_domain builds message permalinks; omit it to send cards without one.
#  - kind: dispatch_card
#    purpose: human_queue
#    dir: dummy/state/dispatch_cards
#    only_immediate: true
#    workspace_domain: example
ledger:
  path: state/ledger.sqlite3
  store_body: false
# Optional credential redaction (P35). With enabled true (default) credentials in message
# text are replaced with [redacted:<kind>] before anything reaches the ledger; the original
# stays in Slack. kinds limits the kinds (default all): private_key, aws_access_key_id,
# slack_token, slack_webhook, github_token, google_api_key, stripe_key, api_key,
# bearer_token, jwt, basic_auth, url_password, aws_secret_access_key, labelled_secret.
# Only known shapes are caught (see docs/INGEST.md, Limits); rotate a leaked credential.
# `slack-dispatch repair redact [--apply] [--days N]` cleans stored bodies.
redaction:
  enabled: true
  kinds: [private_key, aws_access_key_id, slack_token, slack_webhook, github_token,
          google_api_key, stripe_key, api_key, bearer_token, jwt, basic_auth, url_password,
          aws_secret_access_key, labelled_secret]
sources:
  - kind: slack_socket
    enabled: true
    env_file: ~/.local/slack-dispatch.env
    app_token_key: SLACK_APP_TOKEN
    user_token_key: SLACK_USER_TOKEN
  - kind: slack_reconcile
    enabled: true
    reconcile_seconds: 3600
    env_file: ~/.local/slack-dispatch.env
    user_token_key: SLACK_USER_TOKEN
    interval_seconds: 3600
    lookback_days: 7
    discover_channels: false
    replies: true
    replies_lookback_days: 7
    replies_overlap_seconds: 120
    bound_threads: true
    bound_threads_max_age_days: 14
    permanent_error_ttl_seconds: 3600

always_human:
  users: [U0000000091]
  mention_users: [U0000000092]
  owner_user: U0000000093
  # Optional (P36): names that address the operator in plain text. A post containing one
  # (case-insensitive after Unicode NFKC, whitespace runs collapsed, not inside a Slack
  # link or mention label) gets attention owner_mention exactly like <@owner_user>, so it
  # also opens mention_only channels of both modes. ASCII names need word boundaries
  # (sam does not match sample); names with non-ASCII characters, such as a name with a
  # Korean honorific, match anywhere. At most 20 entries of at least 2 characters.
  # Default empty: exact mentions only.
  # mention_texts: [Operator Kim]
classifier:
  kind: none
  enabled: false
  model: placeholder-model
  api_key_env: DUMMY_CLASSIFIER_API_KEY
  taxonomy_version: v1
  lane_descriptions:
    owner: Human-owned work
    support: Support requests
    content: Content work
explicit_tag_pattern: '\[(?P<lane>[a-z0-9-]+)\]'

service:
  state_dir: state
  heartbeat_seconds: 30
  log_dir: logs
  log_level: INFO
  once: false
  followup_window_seconds: 600
  gap_alert_seconds: 300

human_queue:
  mode: digest
  digest_seconds: 1800
  immediate_flags: [always_human, owner_mention]
  # P29: attention flags whose items routed to a lane still notify the operator (FYI).
  # [always_human] stops owner-mention FYIs the lane sessions already handle.
  assigned_notice_flags: [always_human, owner_mention]
bot_messages:
  policy: route_or_exclude
  known_bot_users: []

owner_signals:
  posts: record
  reactions_done: [white_check_mark, heavy_check_mark]
  reactions_ack: [eyes]

# Optional operator console: python -m slack_dispatch.console --config PATH.
# Every key is optional. host defaults to 127.0.0.1 (a local tool without login).
# base_url adds an "Open:" link to human-queue notices and shortens digests to
# per-channel counts. direct_lane names the lane behind the Direct button; when set
# it must be a configured lane. channels maps channel ids to console display names.
# ui_language picks the console page language: en (default) or ko.
# With ko every page string, including the decision buttons, is shown in Korean.
console:
  host: 127.0.0.1
  port: 8811
  base_url: null
  page_size: 50
  lane_hint_people: true
  direct_lane: owner
  ui_language: en
  # P19: seconds an immediate action or GO commit can be undone (default 30, minimum 10).
  undo_seconds: 30
  # P20: the Slack workspace subdomain (for example `example` for example.slack.com).
  # When set, console rows and `inbox --links` carry message permalinks; null hides them.
  workspace_domain: null
  # P21: optional Markdown sessions table, read only. Rows look like
  # `| <last used> | <state> | <title> | <size> | `claude --resume <uuid>` |`; the console
  # then shows each lane session by its title. null (default) shows live names and ids.
  sessions_table: null
  channels:
    C0000000001: dummy-support
    C0000000002: dummy-general
# Optional card decision consumer (P12). dir defaults to the first dispatch_card adapter
# dir; without either the consumer is off. hmac_key_file is the key file the card bot side
# creates (one line DISPATCH_HMAC_KEY=<64 hex>); it lives outside the repository and is
# never logged. Without a readable key, decision files stay where they are.
decisions:
  dir: null
  poll_seconds: 5
  hmac_key_file: null
# Optional scope learning (P13). Reroutes, human assignments of queued items, lane scope
# claims and DM sends become proposals in the console Scope tab; a proposal is
# suggested after min_evidence consistent events. Nothing is promoted automatically.
scope_learning:
  min_evidence: 2
# Optional member-only intake (P15). The service reads users.conversations through the
# reconcile client into the ledger table channel_membership at start and every
# refresh_seconds. policy exclude records events from channels the operator is not a
# member of as excluded (excluded:not_member), never routed or queued; off keeps them.
membership:
  enabled: true
  refresh_seconds: 3600
  policy: exclude
# Optional bot flag user directory (P16). A message is a bot message only when it has no
# author, subtype bot_message, an author in bot_messages.known_bot_users, or an author
# whose users.info profile says is_bot. bot_id or app_id alone (a human posting through
# an app) is a human post. The directory is consulted only for posts that carry bot_id or
# app_id; answers are cached in the ledger table user_directory for ttl_seconds. A failed
# lookup keeps an expired cached answer, else counts the author as human, and the user is
# not looked up again for failure_cooldown_seconds. enabled false keeps the first three
# rules. P20 resolve_names (default true) also looks up every new author (not only app
# posts) from the service flush, so the console and the CLI show names instead of ids;
# `slack-dispatch directory refresh [--missing-only]` backfills earlier authors.
user_directory:
  enabled: true
  ttl_seconds: 86400
  failure_cooldown_seconds: 300
  resolve_names: true
# Optional owner resolver and registry sync (P17). registry_path is the session thread
# registry JSON (the instance supplies the real path; the file is only read). harvest_path
# is an optional scope harvest jsonl (null: no harvest evidence). With enabled true the
# service suggests an owner lane on human queue items (before the classifier), closes
# earlier human queue items of a thread when the owner replies in it
# (close_queue_on_owner_reply), and the console shows registry badges, registry-closed
# staging and Find owner. refresh_seconds bounds how often the registry file is checked;
# activity_days bounds the ledger activity evidence. With enabled false only the inbox CLI
# owner and registry check commands read this section, on demand.
owner_resolver:
  enabled: false
  registry_path: dummy/registry.json
  harvest_path: null
  refresh_seconds: 300
  closed_statuses: [closed, answered, done]
  close_queue_on_owner_reply: true
  activity_days: 60
# Optional delivery log (P18). Every attempt to wake a lane session or to reach the
# operator (digests, cards, attention notices) writes one ledger row in delivery_log:
# kind, lane, target session, message ids, status and the relay result. The console
# Deliveries tab and the inbox CLI `deliveries` command read it. Rows older than
# keep_days are pruned at service start and once a day. result_patterns classify the
# relay result text (case-insensitive substrings) as delivered or not_delivered; a text
# matching neither is unknown. file_inbox writes are not logged.
delivery_log:
  enabled: true
  keep_days: 60
  result_patterns:
    delivered: ['"success":true', "in that session's inbox"]
    not_delivered: ['"success":false', "ENOINBOX", "no inbox", "could not be delivered", "not found"]
