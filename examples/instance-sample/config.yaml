lanes:
  - id: owner
    session: null
    paused: false
  - id: support
    session: session-support-placeholder
    paused: false
  - id: content
    session: null
    paused: true
# lanes[].session takes a session name, a full session id (uuid) or an id prefix of
# at least 8 hex characters. A non-null value wins over a claim in the ledger.
# Ids are resolved against the live session files in sessions_dir (default
# ~/.claude/sessions). The sample uses a dummy directory.
sessions_dir: dummy/sessions
channel_defaults:
  C0000000001: {default: support}
  C0000000002: {default: null}
dm_defaults:
  D0000000001: {default: owner}
person_channel_rules:
  - person: U0000000001
    channel: C0000000002
    lane: content
explicit_tags:
  '[support]': support
  '[content]': content
excluded_channels: [C0000000003]
timers:
  unassigned_seconds: 1800
  unacknowledged_seconds: 14400
  reassign_seconds: 86400
wake_policy:
  mode: immediate
  enabled: true
  debounce_seconds: 90
  storm_per_hour: 30
  batch_seconds: 600
  state_dir: state
  immediate_users: [U0000000004]
  owner_user: U0000000005
inbox:
  root: inbox
notify_adapters:
  - kind: file_inbox
    path: inbox
  - kind: session_message
    command_template: [dummy-session-cli, --target, "{target}", --message, "{message}"]
    template:
      cli: "python -m slack_dispatch.inbox.cli --ledger dummy/state/ledger.sqlite3 --inbox-root dummy/inbox"
      message: |-
        Lane {lane}: {count} inbox item(s) ({kinds}); attention: {attention}.
        IDs: {ids}
        Read thread context: {cli} inbox {lane} --thread
        Reroute lane IDs: {lanes}
        Your session's own records (registry, handoff) stay as they are.
    dry_run: true
    timeout: 60
  - kind: file_drop
    outbox_dir: state/assistant-outbox
    template: {lane: "{lane}", count: "{count}", ids: "{ids}", title: "{title}", body: "{body}"}
ledger:
  path: state/ledger.sqlite3
  store_body: false
sources:
  - kind: slack_socket
    enabled: true
    env_file: ~/.local/slack-dispatch.env
    app_token_key: SLACK_APP_TOKEN
    user_token_key: SLACK_USER_TOKEN
  - kind: slack_reconcile
    enabled: true
    reconcile_seconds: 3600
    env_file: ~/.local/slack-dispatch.env
    user_token_key: SLACK_USER_TOKEN
    interval_seconds: 3600
    lookback_days: 7
    discover_channels: false
    replies: true
    replies_lookback_days: 7
    replies_overlap_seconds: 120
    bound_threads: true
    bound_threads_max_age_days: 14

always_human:
  users: [U0000000091]
  mention_users: [U0000000092]
  owner_user: U0000000093
classifier:
  kind: none
  enabled: false
  model: placeholder-model
  api_key_env: DUMMY_CLASSIFIER_API_KEY
  taxonomy_version: v1
  lane_descriptions:
    owner: Human-owned work
    support: Support requests
    content: Content work
explicit_tag_pattern: '\[(?P<lane>[a-z0-9-]+)\]'

service:
  state_dir: state
  heartbeat_seconds: 30
  log_dir: logs
  log_level: INFO
  once: false
  followup_window_seconds: 600
  gap_alert_seconds: 300

human_queue:
  mode: digest
  digest_seconds: 1800
  immediate_flags: [always_human, owner_mention]
bot_messages:
  policy: route_or_exclude
  known_bot_users: []

owner_signals:
  posts: record
  reactions_done: [white_check_mark, heavy_check_mark]
  reactions_ack: [eyes]
