[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-dispatch"
version = "0.1.0"
description = "Offline-first scaffold for lane-based message dispatch"
requires-python = ">=3.12"
dependencies = ["slack_sdk", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
console = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
slack-dispatch = "slack_dispatch.inbox.cli:main"
slack-dispatch-service = "slack_dispatch.service:main"

[tool.setuptools.packages.find]
include = ["slack_dispatch*"]

[tool.setuptools.package-data]
"slack_dispatch.ledger" = ["schema.sql"]
"slack_dispatch.console" = ["static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
