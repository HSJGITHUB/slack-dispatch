[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-dispatch"
version = "0.1.0"
description = "Resident Slack intake that records every message in a SQLite ledger and routes it to AI agent session lanes or a human queue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = ["slack_sdk", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
console = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
slack-dispatch = "slack_dispatch.inbox.cli:main"
slack-dispatch-service = "slack_dispatch.service:main"

[tool.setuptools.packages.find]
include = ["slack_dispatch*"]

[tool.setuptools.package-data]
"slack_dispatch.ledger" = ["schema.sql"]
"slack_dispatch.console" = ["static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
